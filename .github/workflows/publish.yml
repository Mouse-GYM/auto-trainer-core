name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
    branches:
      - workflows-edit

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # PyPI and TestPyPI reject local version labels, which builds between tags otherwise carry (+g<hash>)
      SETUPTOOLS_SCM_OVERRIDES_FOR_AUTO_TRAINER_CORE: '{local_scheme = "no-local-version"}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from the v* tag
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check that the built version is the tag's
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "expected one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          built="$(basename "${wheels[0]}" | cut -d- -f2)"
          echo "tag ${GITHUB_REF_NAME}: built ${built}, expected ${expected}"
          if [[ "${built}" != "${expected}" ]]; then
            echo "the built version does not match the tag" >&2
            exit 1
          fi

      - name: Check if version already exists on PyPI
        id: check
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -sf "https://pypi.org/pypi/auto-trainer-core/${VERSION}/json" > /dev/null; then
            echo "auto-trainer-core==${VERSION} already exists on PyPI, skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.check.outputs.exists == 'false'

  publish-testpypi:
    if: github.ref == 'refs/heads/workflows-edit'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
