name: Run unit tests

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    strategy:
      matrix:
        python_version: [ "3.8", "3.9", "3.10", "3.11", "3.12" ]
    name: Install core non-editable and run its tests
    runs-on: ubuntu-22.04  # 3.8 not anymore available in ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm versions from the v* tags
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Check that uv.lock matches pyproject.toml
        run: |
          pip install uv
          uv lock --check

      - name: Install auto-trainer-core, non-editable, with its test extra
        run: |
          set -x
          pip install --upgrade pip
          pip install ".[test]"
          pip list

      - name: Check that the installed core is the one under test
        run: |
          python - <<'EOF'
          import importlib.metadata
          import autotrainer.core
          version = autotrainer.core.__version__
          print(autotrainer.core.__file__, version)
          assert "site-packages" in autotrainer.core.__file__
          assert version != "0.0.0", version
          assert version == importlib.metadata.version("auto-trainer-core"), version
          EOF

      - name: Test auto-trainer-core
        run: |
          export COVERAGE_PROCESS_START="$PWD/.coveragerc"
          python -m coverage run --parallel-mode -m pytest -v --color=yes

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-data-${{ matrix.python_version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Combine coverage and enforce threshold
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Download coverage data
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report
        run: |
          uvx coverage combine
          uvx coverage html --skip-covered --skip-empty
          uvx coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          uvx coverage report --fail-under=100
      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: html-coverage-report
          path: htmlcov
